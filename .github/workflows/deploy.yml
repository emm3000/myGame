name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [trunk]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: >-
      vars.DEPLOY_ENABLED == 'true'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'trunk'
      && github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.rule.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: find the last successful production deployment
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=100" --jq '.[].id'); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq 'any(.[]; .state == "success")')" = true ]; then
              base="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.sha')"
              break
            fi
          done
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: skip a docs-only push
        id: rule
        env:
          BASE_SHA: ${{ steps.last.outputs.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          deploy="$(bash .github/scripts/needs-deploy.sh "$BASE_SHA" "$HEAD_SHA")"
          echo "base=${BASE_SHA:-none} head=$HEAD_SHA deploy=$deploy"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  pull:
    name: pull
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    steps:
      - name: install the pinned vercel cli
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir vercel-cli
          for file in package.json package-lock.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/.github/vercel-cli/$file?ref=$HEAD_SHA" > "vercel-cli/$file"
          done
          npm ci --prefix vercel-cli --ignore-scripts --no-audit --no-fund
      - name: pull the api settings
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: |
          mkdir -p pulled/api settings/api
          cd pulled/api
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" pull --yes --environment=production --token="$VERCEL_TOKEN"
          echo "dropped before the build: $(sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' .vercel/.env.* | tr '\n' ' ')"
          rm -f .vercel/.env.*
          jq '{projectId: "artifact", orgId: "artifact", settings}' .vercel/project.json > "$RUNNER_TEMP/settings/api/project.json"
          if grep -rqF -- "$VERCEL_TOKEN" . "$HOME/.local/share/com.vercel.cli" 2>/dev/null; then
            echo "::error::the token was written to disk"
            exit 1
          fi
          if grep -rqF -e "$VERCEL_TOKEN" -e "$VERCEL_ORG_ID" -e "$VERCEL_PROJECT_ID" "$RUNNER_TEMP/settings/api"; then
            echo "::error::the settings artifact holds a secret"
            exit 1
          fi
      - name: pull the web settings
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_WEB_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          mkdir -p pulled/web settings/web
          cd pulled/web
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" pull --yes --environment=production --token="$VERCEL_TOKEN"
          echo "dropped before the build: $(sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' .vercel/.env.* | tr '\n' ' ')"
          rm -f .vercel/.env.*
          jq '{projectId: "artifact", orgId: "artifact", settings}' .vercel/project.json > "$RUNNER_TEMP/settings/web/project.json"
          if grep -rqF -- "$VERCEL_TOKEN" . "$HOME/.local/share/com.vercel.cli" 2>/dev/null; then
            echo "::error::the token was written to disk"
            exit 1
          fi
          if grep -rqF -e "$VERCEL_TOKEN" -e "$VERCEL_ORG_ID" -e "$VERCEL_PROJECT_ID" "$RUNNER_TEMP/settings/web"; then
            echo "::error::the settings artifact holds a secret"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vercel-settings
          path: ${{ runner.temp }}/settings
          if-no-files-found: error
          retention-days: 1

  build:
    name: build
    needs: pull
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-settings
          path: ${{ runner.temp }}/settings
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install the pinned vercel cli
        run: |
          mkdir "$RUNNER_TEMP/vercel-cli"
          cp .github/vercel-cli/package.json .github/vercel-cli/package-lock.json "$RUNNER_TEMP/vercel-cli"
          npm ci --prefix "$RUNNER_TEMP/vercel-cli" --ignore-scripts --no-audit --no-fund
      - name: build the api
        run: |
          mkdir .vercel
          mv "$RUNNER_TEMP/settings/api/project.json" .vercel/project.json
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" build --prod --standalone
          if grep -rl --include=.vc-config.json filePathMap .vercel/output; then
            echo "::error::the build output reads files outside itself"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/prebuilt"
          tar -czf "$RUNNER_TEMP/prebuilt/api.tgz" .vercel/output apps/api/vercel.json
          rm -rf .vercel
      - name: build the web
        env:
          NITRO_PRESET: vercel
        run: |
          mkdir .vercel
          mv "$RUNNER_TEMP/settings/web/project.json" .vercel/project.json
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" build --prod --standalone
          if grep -rl --include=.vc-config.json filePathMap .vercel/output; then
            echo "::error::the build output reads files outside itself"
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/prebuilt/web.tgz" .vercel/output apps/web/vercel.json
          rm -rf .vercel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vercel-prebuilt
          path: ${{ runner.temp }}/prebuilt
          if-no-files-found: error
          retention-days: 1

  migrate:
    name: migrate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: apply the migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: pnpm --filter @mygame/api db:migrate

  deploy:
    name: deploy
    needs: [build, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: install the pinned vercel cli
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir vercel-cli
          for file in package.json package-lock.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/.github/vercel-cli/$file?ref=$HEAD_SHA" > "vercel-cli/$file"
          done
          npm ci --prefix vercel-cli --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-prebuilt
          path: ${{ runner.temp }}/prebuilt
      - name: unpack and check the prebuilt output
        working-directory: ${{ runner.temp }}
        run: |
          for project in api web; do
            mkdir "deploy-$project"
            tar -xzf "prebuilt/$project.tgz" -C "deploy-$project" .vercel/output "apps/$project/vercel.json"
            outside="$(cd "deploy-$project" && find . -path ./.vercel/output -prune -o ! -type d -print)"
            if [ "$outside" != "./apps/$project/vercel.json" ] || [ -L "deploy-$project/apps/$project/vercel.json" ]; then
              echo "::error::the $project artifact holds a file outside .vercel/output that the CLI could read: $outside"
              exit 1
            fi
          done
      - name: deploy the api
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: |
          cd deploy-api
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: deploy the web
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_WEB_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          cd deploy-web
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
