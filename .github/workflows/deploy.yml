name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [trunk]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: >-
      vars.DEPLOY_ENABLED == 'true'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'trunk'
      && github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.rule.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: find the last successful production deployment
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=100" --jq '.[].id'); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq 'any(.[]; .state == "success")')" = true ]; then
              base="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.sha')"
              break
            fi
          done
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: skip a docs-only push
        id: rule
        env:
          BASE_SHA: ${{ steps.last.outputs.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          deploy="$(bash .github/scripts/needs-deploy.sh "$BASE_SHA" "$HEAD_SHA")"
          echo "base=${BASE_SHA:-none} head=$HEAD_SHA deploy=$deploy"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
      VERCEL_WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build the api
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: |
          pnpm dlx vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"
          mv .vercel .vercel-api
      - name: build the web
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          pnpm dlx vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"
          mv .vercel .vercel-web
      - name: apply the migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: pnpm --filter @mygame/api db:migrate
      - name: deploy the api
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: |
          mv .vercel-api .vercel
          pnpm dlx vercel@65.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          mv .vercel .vercel-api
      - name: deploy the web
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          mv .vercel-web .vercel
          pnpm dlx vercel@65.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
