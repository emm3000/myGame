name: health

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  status:
    name: status
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ask the api for its health through the web's domain
        run: curl --fail --silent --show-error --max-time 30 --retry 3 --retry-all-errors --write-out '\n' https://mygame.emm3000.com/api/health
