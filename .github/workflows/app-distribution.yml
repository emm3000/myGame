name: app-distribution

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.android.outputs.android }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: decide whether this push builds
        id: android
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          android="$(bash .github/scripts/android-changed.sh "$BASE_SHA" "$HEAD_SHA" .github/workflows/app-distribution.yml)"
          echo "base=${BASE_SHA:-none} head=$HEAD_SHA android=$android"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    concurrency:
      group: app-distribution-${{ github.ref }}-${{ needs.changes.outputs.android }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: build the unsigned release
        env:
          MYGAME_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-unsigned
          path: apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  distribute:
    name: distribute
    needs: build
    concurrency:
      group: app-distribution-distribute-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-unsigned
          path: unsigned
      - name: pick the build tools
        run: |
          version=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          if [ -z "$version" ]; then
            echo "::error::no stable build tools under $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "build tools: $version"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$version" >> "$GITHUB_ENV"
      - name: decode the keystore
        env:
          MYGAME_RELEASE_KEYSTORE_BASE64: ${{ secrets.MYGAME_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MYGAME_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::MYGAME_RELEASE_KEYSTORE_BASE64 is not readable"
            exit 1
          fi
          printf '%s' "$MYGAME_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: align and sign
        env:
          MYGAME_RELEASE_STORE_PASSWORD: ${{ secrets.MYGAME_RELEASE_STORE_PASSWORD }}
          MYGAME_RELEASE_KEY_ALIAS: ${{ secrets.MYGAME_RELEASE_KEY_ALIAS }}
          MYGAME_RELEASE_KEY_PASSWORD: ${{ secrets.MYGAME_RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in MYGAME_RELEASE_STORE_PASSWORD MYGAME_RELEASE_KEY_ALIAS MYGAME_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::not readable:$missing"
            exit 1
          fi
          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/app-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$MYGAME_RELEASE_KEY_ALIAS" \
            --ks-pass env:MYGAME_RELEASE_STORE_PASSWORD \
            --key-pass env:MYGAME_RELEASE_KEY_PASSWORD \
            --out dist/app-release.apk \
            "$RUNNER_TEMP/app-release-aligned.apk"
      - name: verify the signature
        run: |
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/app-release.apk
          "$BUILD_TOOLS/aapt2" dump badging dist/app-release.apk | sed -n 1p
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: write the service account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not readable"
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
      - name: upload to App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          RELEASE_NOTES: |
            ${{ github.event.head_commit.message || 'workflow_dispatch' }}
            Commit ${{ github.sha }} on ${{ github.ref_name }}, versionCode ${{ github.run_number }}
            ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          npx --yes firebase-tools@15.34.1 appdistribution:distribute dist/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups owner \
            --release-notes "$RELEASE_NOTES"
      - name: remove the key material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/service-account.json"
