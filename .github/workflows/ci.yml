name: ci

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: mygame
          POSTGRES_DB: mygame_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mygame_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:mygame@localhost:5432/mygame_ci
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_URL: http://127.0.0.1:8025
      MAIL_FROM: myGame <no-reply@mygame.local>
      WEB_URL: http://localhost:3299
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
      - name: build and probe the api
        run: |
          pnpm -r build
          API_PORT=3199 node apps/api/dist/server.js &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS -w '\n' http://localhost:3199/health
