name: ci

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: mygame
          POSTGRES_DB: mygame_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mygame_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:mygame@localhost:5432/mygame_ci
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_URL: http://127.0.0.1:8025
      MAIL_FROM: myGame <no-reply@mygame.local>
      WEB_URL: http://localhost:3299
    steps:
      - name: run the test database without durability
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d mygame_ci -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
          settings=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d mygame_ci -tA \
            -c "SELECT string_agg(name || '=' || setting, ',' ORDER BY name) FROM pg_settings WHERE name IN ('fsync', 'full_page_writes', 'synchronous_commit')")
          echo "$settings"
          if [ "$settings" != "fsync=off,full_page_writes=off,synchronous_commit=off" ]; then
            echo "::error::the test database still runs with durability: $settings"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
      - name: build and probe the api
        run: |
          pnpm -r build
          node --input-type=module --eval "const { default: api } = await import('./apps/api/dist/index.js'); const response = await api.fetch(new Request('http://probe/health')); console.log(response.status, await response.text()); process.exit(response.ok ? 0 : 1)"

  vercel:
    name: vercel
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: require the vercel secrets
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
          VERCEL_WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_API_PROJECT_ID VERCEL_WEB_PROJECT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::not readable from a pull request job:$missing"
            exit 1
          fi
      - name: pull the api settings
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: |
          mkdir vercel-api
          cd vercel-api
          npx --yes vercel@65.2.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
          echo "dropped before the build: $(sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' .vercel/.env.* | tr '\n' ' ')"
          rm -f .vercel/.env.*
          if grep -rqF -- "$VERCEL_TOKEN" . "$HOME/.local/share/com.vercel.cli" 2>/dev/null; then
            echo "::error::the token was written to disk"
            exit 1
          fi
      - name: pull the web settings
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          mkdir vercel-web
          cd vercel-web
          npx --yes vercel@65.2.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
          echo "dropped before the build: $(sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' .vercel/.env.* | tr '\n' ' ')"
          rm -f .vercel/.env.*
          if grep -rqF -- "$VERCEL_TOKEN" . "$HOME/.local/share/com.vercel.cli" 2>/dev/null; then
            echo "::error::the token was written to disk"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build the api
        run: |
          mv "$RUNNER_TEMP/vercel-api/.vercel" .vercel
          pnpm dlx vercel@65.2.0 build
          rm -rf .vercel
      - name: build the web
        env:
          NITRO_PRESET: vercel
        run: |
          mv "$RUNNER_TEMP/vercel-web/.vercel" .vercel
          pnpm dlx vercel@65.2.0 build
          rm -rf .vercel

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew detekt checkModuleBoundaries checkComposeFreeViewModels testDebugUnitTest assembleDebug
